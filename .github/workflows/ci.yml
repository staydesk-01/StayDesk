name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest runners moved to kernel 6.19+ in Oct 2026, which mongod
    # (TCMalloc bug, SERVER-121912) refuses to start on. Pin to 22.04 until
    # the runner images ship kernel 7.0.14+.
    runs-on: ubuntu-22.04
    services:
      mongodb:
        # mongo:8.0.5+ cannot start on GitHub runners (Linux kernel 6.19+,
        # MongoDB SERVER-121912). 8.0.4 is the last 8.x release that boots.
        image: mongo:8.0.4
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
